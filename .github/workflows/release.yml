name: Release

# OSプレフィックス付きタグ (例: windows-v1.0.0) で該当OSの Release を作成する。
# 起動方法は3通り:
#   1. タグを push (git push origin windows-vX.Y.Z)
#   2. GitHub Web で Release を作成 (release: published イベント)
#   3. Actions タブから手動実行 (workflow_dispatch、タグを選んで実行)
# ※ Actions (GITHUB_TOKEN) 自身が作った Release では再発火しないため 1 と 2 は重複しない
on:
  push:
    tags:
      - "windows-v*"
      - "macos-v*"
      - "linux-v*"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Windows: Ahk2Exe で単体 exe にコンパイルし、MSI (WiX 5) とポータブル zip を添付
  windows:
    if: startsWith(github.ref_name, 'windows-v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: バージョン抽出 (windows-v1.0.0 → 1.0.0)
        id: v
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#windows-v}" >> "$GITHUB_OUTPUT"

      - name: AutoHotkey と Ahk2Exe を取得
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          curl.exe -sSL -o ahk.zip https://github.com/AutoHotkey/AutoHotkey/releases/download/v2.0.27/AutoHotkey_2.0.27.zip
          Expand-Archive ahk.zip -DestinationPath ahk
          $asset = (Invoke-RestMethod https://api.github.com/repos/AutoHotkey/Ahk2Exe/releases/latest).assets |
            Where-Object name -like '*.zip' | Select-Object -First 1
          curl.exe -sSL -o ahk2exe.zip $asset.browser_download_url
          Expand-Archive ahk2exe.zip -DestinationPath ahk2exe

      - name: 単体 exe にコンパイル
        shell: pwsh
        run: |
          New-Item -ItemType Directory build | Out-Null
          Copy-Item windows\wincolor.ahk, shared\colors.json, shared\rules.json build\
          $p = Start-Process -Wait -PassThru ahk2exe\Ahk2Exe.exe -ArgumentList `
            '/silent', 'verbose', '/in', 'build\wincolor.ahk', '/out', 'build\wincolor.exe', '/base', 'ahk\AutoHotkey64.exe'
          if ($p.ExitCode -ne 0 -or -not (Test-Path build\wincolor.exe)) { throw "Ahk2Exe failed (exit=$($p.ExitCode))" }

      - name: MSI をビルド (WiX 5)
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          New-Item -ItemType Directory dist | Out-Null
          wix build windows/installer/wincolor.wxs -pdbtype none `
            -d ProductVersion=${{ steps.v.outputs.version }} -d SourceDir=build `
            -o "dist/wincolor-windows-v${{ steps.v.outputs.version }}.msi"

      - name: ポータブル zip を作成 (exe + colors.json + ソース + README)
        shell: pwsh
        run: |
          New-Item -ItemType Directory pkg\wincolor | Out-Null
          Copy-Item build\wincolor.exe, build\colors.json, build\rules.json, windows\wincolor.ahk, windows\README.md pkg\wincolor\
          Compress-Archive -Path pkg\wincolor -DestinationPath "dist/wincolor-windows-v${{ steps.v.outputs.version }}.zip"

      - name: Release 作成
        uses: softprops/action-gh-release@v2
        with:
          name: wincolor windows v${{ steps.v.outputs.version }}
          files: |
            dist/*.msi
            dist/*.zip
          generate_release_notes: true

  # Linux: GNOME Shell 拡張を検証し、gnome-extensions install 可能な拡張 zip
  #        (shared/colors.json 同梱) とインストーラ付きバンドル zip を添付
  linux:
    if: startsWith(github.ref_name, 'linux-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: バージョン抽出 (linux-v0.1.0 → 0.1.0)
        id: v
        run: echo "version=${GITHUB_REF_NAME#linux-v}" >> "$GITHUB_OUTPUT"

      - name: 依存ツール
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libglib2.0-bin zip

      - name: バージョン整合性チェック (metadata.json / bin/wincolor がタグと一致)
        run: |
          version='${{ steps.v.outputs.version }}'
          meta=$(jq -r '."version-name"' linux/gnome-extension/metadata.json)
          cli=$(sed -n 's/^WINCOLOR_VERSION=//p' linux/bin/wincolor)
          [ "$meta" = "$version" ] || { echo "::error::metadata.json version-name=$meta != tag $version"; exit 1; }
          [ "$cli" = "$version" ]  || { echo "::error::bin/wincolor WINCOLOR_VERSION=$cli != tag $version"; exit 1; }

      - name: 検証 (JSON / bash 構文 / ESM 構文 / gschema コンパイル)
        run: |
          jq -e '.uuid and ."shell-version"' linux/gnome-extension/metadata.json
          jq -e '.presets | length > 0 and all(.name and (.hex | test("^#[0-9A-Fa-f]{6}$")))' shared/colors.json
          jq -e '.rules | type == "array"' shared/rules.json
          bash -n linux/bin/wincolor
          bash -n linux/install.sh
          bash -n linux/get.sh
          cp linux/gnome-extension/extension.js "$RUNNER_TEMP/extension.mjs"
          node --check "$RUNNER_TEMP/extension.mjs"
          glib-compile-schemas --strict --dry-run linux/gnome-extension/schemas/

      - name: 拡張 zip を作成 (gnome-extensions install 用)
        run: |
          version='${{ steps.v.outputs.version }}'
          uuid=$(jq -r .uuid linux/gnome-extension/metadata.json)
          mkdir -p build dist
          cp -r linux/gnome-extension "build/$uuid"
          cp shared/colors.json "build/$uuid/"
          glib-compile-schemas "build/$uuid/schemas/"
          (cd "build/$uuid" && zip -r "../../dist/wincolor-linux-v$version-extension.zip" .)
          unzip -l "dist/wincolor-linux-v$version-extension.zip"

      - name: バンドル zip を作成 (install.sh + 拡張 + CLI + shared + README)
        run: |
          version='${{ steps.v.outputs.version }}'
          mkdir -p pkg/wincolor
          cp -r linux/. pkg/wincolor/
          cp -r shared pkg/wincolor/
          cp README.md pkg/wincolor/README-project.md
          (cd pkg && zip -r "../dist/wincolor-linux-v$version.zip" wincolor)

      - name: インストーラのスモークテスト (一時 HOME)
        run: |
          version='${{ steps.v.outputs.version }}'
          # ランナーは XDG_CONFIG_HOME=/home/runner/.config を設定しているので、一時 HOME 側へ向ける
          export HOME="$RUNNER_TEMP/home"; mkdir -p "$HOME"
          export XDG_CONFIG_HOME="$HOME/.config" XDG_DATA_HOME="$HOME/.local/share"
          NO_ENABLE=1 bash pkg/wincolor/install.sh
          test -f "$HOME/.local/share/gnome-shell/extensions/window-color-tag@smart2j.jp/schemas/gschemas.compiled"
          cmp shared/colors.json "$HOME/.local/share/gnome-shell/extensions/window-color-tag@smart2j.jp/colors.json"
          cmp shared/rules.json "$HOME/.config/wincolor/rules.json"
          test -x "$HOME/.local/bin/wincolor"
          "$HOME/.local/bin/wincolor" --version | grep -qx "wincolor (linux) v$version"
          NO_ENABLE=1 bash pkg/wincolor/install.sh --uninstall
          test -f "$HOME/.config/wincolor/rules.json"   # ユーザー設定は残る

      - name: Release 作成
        uses: softprops/action-gh-release@v2
        with:
          name: wincolor linux v${{ steps.v.outputs.version }}
          files: dist/wincolor-linux-*.zip
          generate_release_notes: true
          body: |
            ## インストール (GNOME Shell 50 / 51)
            ```sh
            curl -fsSL https://raw.githubusercontent.com/tryandhappy/wincolor/main/linux/get.sh | WINCOLOR_VERSION=${{ steps.v.outputs.version }} bash
            ```
            または zip を手で展開: `unzip wincolor-linux-v${{ steps.v.outputs.version }}.zip && cd wincolor && ./install.sh`
            拡張のみ入れる場合: `gnome-extensions install wincolor-linux-v${{ steps.v.outputs.version }}-extension.zip`
            (CLI `bin/wincolor` は別途 PATH に配置)。いずれも GNOME Shell の再起動が必要。
            対応環境は README の「対応環境 (Linux 版)」を参照。

  # macOS: 実装が入るまではソース zip のみ
  macos:
    if: startsWith(github.ref_name, 'macos-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: バージョン抽出 (macos-v0.1.0 → 0.1.0)
        id: v
        run: echo "version=${GITHUB_REF_NAME#macos-v}" >> "$GITHUB_OUTPUT"

      - name: パッケージ作成
        run: |
          version='${{ steps.v.outputs.version }}'
          test -d macos || { echo "::error::directory 'macos' not found"; exit 1; }
          mkdir -p dist/wincolor
          cp -r macos shared README.md dist/wincolor/
          (cd dist && zip -r "wincolor-macos-v$version.zip" wincolor)

      - name: Release 作成
        uses: softprops/action-gh-release@v2
        with:
          name: wincolor macos v${{ steps.v.outputs.version }}
          files: dist/wincolor-*.zip
          generate_release_notes: true
